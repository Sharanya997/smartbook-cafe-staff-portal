<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBook Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar (hidden on login) -->
    <aside id="sidebar" class="sidebar hidden">
      <div class="brand">
        <div class="brand-icon">📖</div>
        <div>
          <div class="brand-name">SmartBook</div>
          <div class="brand-sub">Staff Portal</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" class="nav-link" data-route="dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="#/kitchen" class="nav-link" data-route="kitchen">
          <span class="nav-icon">🍳</span> Kitchen Orders
        </a>
        <a href="#/library" class="nav-link" data-route="library">
          <span class="nav-icon">📚</span> Library Monitor
        </a>
        <a href="#/catalog" class="nav-link" data-route="catalog">
          <span class="nav-icon">📖</span> Book Catalog
        </a>
      </nav>
      <button id="logoutBtn" class="logout">🚪 Sign out</button>
    </aside>

    <!-- Main view container -->
    <main id="main" class="main main--no-sidebar"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
